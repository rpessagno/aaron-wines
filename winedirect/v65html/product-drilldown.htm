  <div class="product-img">
    <v65:product:photo showPhoto="1"></v65:product:photo>
  </div>

  <div class="product-content">

    <h1>
      <v65:product:title></v65:product:title>
    </h1>

    <div class="product-cart">
      <v65:product:actionMessage></v65:product:actionMessage>
      <v65:product:inCompliantStateMessage></v65:product:inCompliantStateMessage>
      <v65:product:availability></v65:product:availability>
      <v65:product:addToCart></v65:product:addToCart>
    </div>

    <div class="product-description">

      <v65:product:description></v65:product:description>
      <v65:wine:tastingNotes></v65:wine:tastingNotes>
          
    </div>
    
  </div>

</div> <!-- /.product-drilldown -->
